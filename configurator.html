<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfigurator 3D – EcoMunicipal</title>
  <meta name="description" content="Skonfiguruj swoją zabudowę komunalną w pełnym 3D. Zobacz swój pojazd przed zamówieniem.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <style>
    body { overflow: hidden; margin: 0; padding: 0; background: #0f1115; color: #fff; font-family: var(--font-base); }
    .header { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; }
    .header__inner { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .header__logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-family: var(--font-heading); font-weight: 700; font-size: 24px; }
    .header__logo span { color: var(--color-accent-primary); }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; color: #a1a1aa; text-decoration: none; font-size: 14px; transition: color 0.3s; }
    .btn-back:hover { color: #fff; }

    /* Layout */
    .configurator { display: flex; height: 100vh; padding-top: 65px; box-sizing: border-box; }
    .panel-left { width: 350px; background: rgba(24, 24, 27, 0.95); border-right: 1px solid rgba(255,255,255,0.1); padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 30px; z-index: 10; }
    .panel-right { flex: 1; position: relative; }
    #canvas-container { width: 100%; height: 100%; }

    /* Controls */
    .control-group { display: flex; flex-direction: column; gap: 10px; }
    .control-title { font-family: var(--font-heading); font-size: 16px; font-weight: 600; color: #fff; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .color-picker { display: flex; gap: 10px; }
    .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
    .color-btn.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,255,255,0.3); }
    .btn-option { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 15px; border-radius: 8px; cursor: pointer; text-align: left; transition: all 0.3s; font-family: var(--font-base); font-size: 14px; }
    .btn-option.active { background: rgba(34, 197, 94, 0.1); border-color: var(--color-accent-primary); color: var(--color-accent-primary); font-weight: 600; }
    
    .panel-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .price-tag { font-family: var(--font-heading); font-size: 28px; font-weight: 800; color: var(--color-accent-primary); margin-bottom: 15px; display: block; }

    /* Canvas UI Overlay */
    .canvas-ui { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 30px; backdrop-filter: blur(10px); }
    .canvas-ui span { color: #fff; font-size: 12px; display: flex; align-items: center; gap: 5px; opacity: 0.8; }

    @media (max-width: 900px) {
      .configurator { flex-direction: column; }
      .panel-left { width: 100%; height: 50vh; border-right: none; border-top: 1px solid rgba(255,255,255,0.1); order: 2; }
      .panel-right { height: 50vh; order: 1; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="header__logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Eco<span>Municipal</span>
      </a>
      <a href="index.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg> Wróć do strony
      </a>
    </div>
  </header>

  <div class="configurator">
    <!-- Configuration Panel -->
    <div class="panel-left">
      <div>
        <h2 style="font-family: var(--font-heading); margin: 0 0 5px 0;">Konfigurator PRO</h2>
        <p style="color: #a1a1aa; font-size: 14px; margin: 0 0 20px 0;">Zbuduj swoją idealną śmieciarkę.</p>
      </div>

      <div class="control-group">
        <div class="control-title">Pojemność zabudowy</div>
        <button class="btn-option" data-cap="12">Kompakt (12 m³) - Idealna do centrum</button>
        <button class="btn-option active" data-cap="18">Standard (18 m³) - Najpopularniejsza</button>
        <button class="btn-option" data-cap="22">Maxi (22 m³) - Duże osiedla</button>
      </div>

      <div class="control-group">
        <div class="control-title">Kolor zabudowy</div>
        <div class="color-picker" id="body-colors">
          <button class="color-btn active" style="background: #ffffff" data-color="#ffffff"></button>
          <button class="color-btn" style="background: #22c55e" data-color="#22c55e"></button>
          <button class="color-btn" style="background: #3b82f6" data-color="#3b82f6"></button>
          <button class="color-btn" style="background: #f97316" data-color="#f97316"></button>
          <button class="color-btn" style="background: #ef4444" data-color="#ef4444"></button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-title">Kolor podwozia (Kabina)</div>
        <div class="color-picker" id="cabin-colors">
          <button class="color-btn active" style="background: #ffffff" data-color="#ffffff"></button>
          <button class="color-btn" style="background: #1e293b" data-color="#1e293b"></button>
          <button class="color-btn" style="background: #22c55e" data-color="#22c55e"></button>
        </div>
      </div>

      <div class="panel-footer">
        <span class="price-tag" id="price-display">245 000 PLN</span>
        <button class="btn btn--primary" style="width: 100%;">Wyślij zapytanie o ten model</button>
      </div>
    </div>

    <!-- 3D Canvas -->
    <div class="panel-right">
      <div id="canvas-container"></div>
      <div class="canvas-ui">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21.54 15H17a2 2 0 0 0-2 2v4.54"/><path d="M7 3.34V5a3 3 0 0 0 3 3v0a2 2 0 0 1 2 2v0c0 1.1.9 2 2 2v0a2 2 0 0 0 2-2v0c0-1.1.9-2 2-2h3.17"/><path d="M11 21.95V18a2 2 0 0 0-2-2v0a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05"/><circle cx="12" cy="12" r="10"/></svg> Obracaj (Klik + Przeciągnij)</span>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg> Przybliżaj (Scroll)</span>
      </div>
    </div>
  </div>

  <script src="js/configurator.js"></script>
</body>
</html>
